<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ember: Crystal Run</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;color:#eee;font:14px/1.4 ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{position:fixed;left:16px;top:14px;display:grid;gap:4px;text-shadow:0 1px 3px #000a;font-size:15px;pointer-events:none}
  #hud .dim{font:12px ui-monospace,Consolas,monospace;opacity:.7}
  #banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);background:#000a;padding:12px 22px;border-radius:999px;font-size:17px;opacity:0;transition:.3s;pointer-events:none}
  #banner.show{opacity:1;transform:translate(-50%,0)}
  #intro{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(#0000,#000b);transition:opacity .4s;pointer-events:none}
  #intro.hide{opacity:0}
  #intro div{text-align:center;background:#000c;padding:26px 34px;border-radius:18px;max-width:420px}
  #intro h1{margin:0 0 6px;font-size:26px;letter-spacing:.02em}
  #intro p{margin:6px 0;opacity:.85}
  kbd{font:12px ui-monospace,Consolas,monospace;border:1px solid #fff4;border-radius:4px;padding:1px 5px}
  #err{position:fixed;inset:auto 16px 16px;color:#f88;font:13px ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<div id="intro"><div>
  <h1>Crystal Run</h1>
  <p>Collect every crystal on the island.</p>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Shift</kbd> run<br>mouse or <kbd>Q</kbd><kbd>E</kbd> to look &nbsp; green pads launch you</p>
  <p style="opacity:.6">Click to start</p>
</div></div>
<pre id="err"></pre>
<script>addEventListener("error", (e) => { document.getElementById("err").textContent = String(e.message); });</script>
<script type="module" src="../dist/web/game.js"></script>
</body>
</html>
