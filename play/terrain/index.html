<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>terra-gen</title>
<style>
  :root{--bg:#0e0f11;--panel:#16171a;--line:#24262b;--ink:#e8e8e8;--mute:#8a8e96;--acc:#f2c14e}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
  aside{background:var(--panel);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:20px}
  .sub{margin:0 0 6px;color:var(--mute);font-size:13px}
  label{display:grid;gap:5px;color:var(--mute);font-size:12.5px}
  label span{display:flex;justify-content:space-between}
  label b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--acc)}
  input[type=number],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;width:100%}
  .row{display:flex;gap:8px}
  button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#22252a;color:var(--ink)}
  button:hover{background:#2b2e34}
  button.primary{background:var(--ink);color:#111;font-weight:600;flex:1}
  button.primary:hover{background:#fff}
  button:disabled{opacity:.5;cursor:wait}
  .views{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
  .views button{flex:1;padding:6px;background:none;color:var(--mute);font-size:12.5px}
  .views button.on{background:#22252a;color:var(--ink)}
  #stats{font:12px ui-monospace,Consolas,monospace;color:var(--mute);white-space:pre-line;margin-top:auto}
  .stage{display:grid;place-items:center;padding:24px;position:relative}
  canvas{max-width:min(100%,86vh);aspect-ratio:1;width:100%;image-rendering:pixelated;border-radius:10px;box-shadow:0 20px 60px #0008}
  #busy{position:absolute;inset:0;display:none;place-items:center;color:var(--mute)}
  body.busy #busy{display:grid}
  a{color:var(--ink)}
  @media (max-width:760px){main{grid-template-columns:1fr}.stage{padding:12px}}
</style>
</head>
<body>
<main>
  <aside>
    <div>
      <h1>terra-gen</h1>
      <p class="sub">Procedural islands: simplex noise, hydraulic erosion, biomes. Same algorithms as the <a href="https://github.com/vaughnponcee/terra-gen">Python package</a>.</p>
    </div>
    <div class="row">
      <button class="primary" id="go">Generate</button>
      <button id="rand" title="New random seed">Random</button>
    </div>
    <label><span>Seed</span><input type="number" id="seed" value="7"></label>
    <label><span>Size</span><select id="size"><option>128</option><option selected>256</option><option>384</option></select></label>
    <label><span>Erosion droplets <b id="drops-v"></b></span><input type="range" id="drops" min="0" max="1.5" step="0.05" value="0.75"></label>
    <label><span>Sea level <b id="sea-v"></b></span><input type="range" id="sea" min="0.2" max="0.6" step="0.01" value="0.38"></label>
    <label><span>Island falloff <b id="island-v"></b></span><input type="range" id="island" min="0" max="1" step="0.05" value="0.6"></label>
    <label><span>Domain warp <b id="warp-v"></b></span><input type="range" id="warp" min="0" max="1" step="0.05" value="0.35"></label>
    <label><span>Ridges <b id="ridge-v"></b></span><input type="range" id="ridge" min="0" max="1" step="0.05" value="0.35"></label>
    <label><span>Scale <b id="scale-v"></b></span><input type="range" id="scale" min="1.5" max="6" step="0.25" value="3"></label>
    <div class="views" id="views">
      <button data-v="biome" class="on">Biomes</button>
      <button data-v="height">Height</button>
      <button data-v="flow">Rivers</button>
      <button data-v="raw">No erosion</button>
    </div>
    <button id="save">Download PNG</button>
    <div id="stats"></div>
  </aside>
  <div class="stage"><canvas id="out" width="256" height="256"></canvas><div id="busy">Generating...</div></div>
</main>
<script>
"use strict";
// ---- seeded RNG (mulberry32) -------------------------------------------------
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---- simplex noise (Gustavson), fBm, ridged: ported from terragen/noise.py ----
const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
const GX = [1, -1, 1, -1, 1, -1, 0, 0, 1, -1, 1, -1], GY = [1, 1, -1, -1, 0, 0, 1, -1, 1, 1, -1, -1];
function simplex(seed) {
  const p = Array.from({ length: 256 }, (_, i) => i), r = rng(seed * 2654435761 + 1);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  const perm = new Uint8Array(512), gi = new Uint8Array(512);
  for (let i = 0; i < 512; i++) { perm[i] = p[i & 255]; gi[i] = perm[i] % 12; }
  return (x, y) => {
    const s = (x + y) * F2, i = Math.floor(x + s), j = Math.floor(y + s), t = (i + j) * G2;
    const x0 = x - (i - t), y0 = y - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, t0 = 0.5 - x0 * x0 - y0 * y0, t1 = 0.5 - x1 * x1 - y1 * y1, t2 = 0.5 - x2 * x2 - y2 * y2;
    if (t0 > 0) { const g = gi[ii + perm[jj]]; t0 *= t0; n += t0 * t0 * (GX[g] * x0 + GY[g] * y0); }
    if (t1 > 0) { const g = gi[ii + i1 + perm[jj + j1]]; t1 *= t1; n += t1 * t1 * (GX[g] * x1 + GY[g] * y1); }
    if (t2 > 0) { const g = gi[ii + 1 + perm[jj + 1]]; t2 *= t2; n += t2 * t2 * (GX[g] * x2 + GY[g] * y2); }
    return 70 * n;
  };
}
function fbm(noise, x, y, oct = 6, lac = 2, per = 0.5) {
  let amp = 1, f = 1, tot = 0, norm = 0;
  for (let o = 0; o < oct; o++) { tot += amp * noise(x * f, y * f); norm += amp; amp *= per; f *= lac; }
  return tot / norm;
}
function ridged(noise, x, y, oct = 6, lac = 2, per = 0.5) {
  let amp = 1, f = 1, tot = 0, norm = 0;
  for (let o = 0; o < oct; o++) { const v = 1 - Math.abs(noise(x * f, y * f)); tot += amp * v * v; norm += amp; amp *= per; f *= lac; }
  return tot / norm;
}
function heightfield(size, seed, o) {
  const base = simplex(seed), wxn = simplex(seed + 101), wyn = simplex(seed + 202);
  const h = new Float32Array(size * size), inv = o.scale / size;
  for (let y = 0; y < size; y++) {
    const ny = y * inv;
    for (let x = 0; x < size; x++) {
      const nx = x * inv;
      let nx2 = nx, ny2 = ny;
      if (o.warp) { nx2 += fbm(wxn, nx, ny, 3) * o.warp; ny2 += fbm(wyn, nx, ny, 3) * o.warp; }
      let v = fbm(base, nx2, ny2) * 0.5 + 0.5;
      if (o.ridge) v = v * (1 - o.ridge) + ridged(base, nx2 + 17.3, ny2 - 9.1) * o.ridge;
      if (o.island) {
        const dx = (x / (size - 1)) * 2 - 1, dy = (y / (size - 1)) * 2 - 1, d = Math.min(1, Math.hypot(dx, dy));
        v = v * (1 - o.island) + v * o.island * (1 - d * d);
      }
      h[y * size + x] = v;
    }
  }
  let lo = Infinity, hi = -Infinity;
  for (const v of h) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for (let i = 0; i < h.length; i++) h[i] = (h[i] - lo) / (hi - lo || 1);
  return h;
}

// ---- droplet erosion (Beyer 2015): ported from terragen/erosion.py ----------
function brushes(size, radius) {
  const idx = [], wts = [];
  for (let cy = 0; cy < size; cy++) for (let cx = 0; cx < size; cx++) {
    const I = [], W = [];
    for (let dy = -radius; dy <= radius; dy++) {
      const y = cy + dy; if (y < 0 || y >= size) continue;
      for (let dx = -radius; dx <= radius; dx++) {
        const x = cx + dx, d2 = dx * dx + dy * dy;
        if (x >= 0 && x < size && d2 <= radius * radius) { I.push(y * size + x); W.push(1 - Math.sqrt(d2) / radius); }
      }
    }
    const s = W.reduce((a, b) => a + b, 0);
    idx.push(Int32Array.from(I)); wts.push(Float32Array.from(W.map((w) => w / s)));
  }
  return [idx, wts];
}
function erode(h, size, drops, seed, flow) {
  const P = { maxSteps: 30, inertia: 0.05, capacity: 4, minSlope: 0.01, erode: 0.3, deposit: 0.3, evaporate: 0.01, gravity: 4 };
  const [bi, bw] = brushes(size, 3), r = rng(seed), lim = size - 1.0001;
  const hg = (px, py) => {
    const x = px | 0, y = py | 0, u = px - x, v = py - y, i = y * size + x;
    const nw = h[i], ne = h[i + 1], sw = h[i + size], se = h[i + size + 1];
    return [nw * (1 - u) * (1 - v) + ne * u * (1 - v) + sw * (1 - u) * v + se * u * v, (ne - nw) * (1 - v) + (se - sw) * v, (sw - nw) * (1 - u) + (se - ne) * u];
  };
  let eroded = 0;
  for (let d = 0; d < drops; d++) {
    let px = r() * lim, py = r() * lim, dx = 0, dy = 0, speed = 1, water = 1, sed = 0;
    for (let s = 0; s < P.maxSteps; s++) {
      const nx = px | 0, ny = py | 0, ci = ny * size + nx, ox = px - nx, oy = py - ny;
      const [height, gx, gy] = hg(px, py);
      flow[ci] += water;
      dx = dx * P.inertia - gx * (1 - P.inertia); dy = dy * P.inertia - gy * (1 - P.inertia);
      const ln = Math.hypot(dx, dy);
      if (ln < 1e-12) { const a = r() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); } else { dx /= ln; dy /= ln; }
      px += dx; py += dy;
      if (!(px >= 0 && px < lim && py >= 0 && py < lim)) break;
      const dh = hg(px, py)[0] - height;
      const cap = Math.max(-dh, P.minSlope) * speed * water * P.capacity;
      if (sed > cap || dh > 0) {
        const amount = dh > 0 ? Math.min(dh, sed) : (sed - cap) * P.deposit;
        sed -= amount;
        h[ci] += amount * (1 - ox) * (1 - oy); h[ci + 1] += amount * ox * (1 - oy);
        h[ci + size] += amount * (1 - ox) * oy; h[ci + size + 1] += amount * ox * oy;
      } else {
        const amount = Math.min((cap - sed) * P.erode, -dh), I = bi[ci], W = bw[ci];
        for (let k = 0; k < I.length; k++) { const take = Math.min(amount * W[k], h[I[k]]); h[I[k]] -= take; sed += take; eroded += take; }
      }
      speed = Math.sqrt(Math.max(0, speed * speed + dh * -P.gravity));
      water *= 1 - P.evaporate;
    }
  }
  return eroded;
}

// ---- climate and biomes: ported from terragen/biome.py ------------------------
const BIOMES = {
  deep_ocean: [24, 52, 92], ocean: [38, 82, 130], beach: [214, 199, 150], desert: [210, 185, 130], grassland: [140, 170, 90],
  shrubland: [150, 150, 100], temperate_forest: [70, 120, 60], rainforest: [40, 100, 55], taiga: [90, 115, 90], tundra: [150, 150, 135],
  bare_rock: [120, 115, 110], snow: [240, 242, 245], river: [60, 110, 170],
};
function classify(height, moist, temp, sea, flowN) {
  if (height < sea - 0.12) return "deep_ocean";
  if (height < sea) return "ocean";
  if (flowN > 0.82) return "river";
  if (height < sea + 0.015) return "beach";
  if (temp < 0.2) return "snow";
  if (temp < 0.33) return moist < 0.5 ? "tundra" : "taiga";
  const alt = (height - sea) / (1 - sea);
  if (alt > 0.82) return "bare_rock";
  if (temp < 0.5) return ["shrubland", "taiga", "taiga"][Math.min(2, Math.floor(moist * 3))];
  if (moist < 0.25) return "desert";
  if (moist < 0.45) return "grassland";
  if (moist < 0.7) return "temperate_forest";
  return temp > 0.7 ? "rainforest" : "temperate_forest";
}
function climate(h, size, sea, seed, flow) {
  // distance to water (multi-source BFS)
  const dist = new Int32Array(size * size).fill(1e9), q = new Int32Array(size * size);
  let qh = 0, qt = 0;
  for (let i = 0; i < h.length; i++) if (h[i] < sea) { dist[i] = 0; q[qt++] = i; }
  while (qh < qt) {
    const i = q[qh++], x = i % size, y = (i / size) | 0, d = dist[i] + 1;
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
      const j = ny * size + nx;
      if (dist[j] > d) { dist[j] = d; q[qt++] = j; }
    }
  }
  const sx = simplex(seed + 777), reach = Math.max(1, 0.15 * size);
  let fmax = 0; for (const f of flow) fmax = Math.max(fmax, f);
  const lf = Math.log1p(fmax);
  const moist = new Float32Array(size * size), temp = new Float32Array(size * size), flowN = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    const lat = Math.abs((y / (size - 1)) * 2 - 1), base = 1 - 0.55 * lat;
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const n = fbm(sx, (x / size) * 2.5, (y / size) * 2.5, 4) * 0.5 + 0.5;
      const coast = dist[i] < 1e9 ? Math.exp(-dist[i] / reach) : 0;
      flowN[i] = lf ? Math.log1p(flow[i]) / lf : 0;
      moist[i] = Math.min(1, Math.max(0, 0.5 * n + 0.35 * coast + 0.15 * flowN[i]));
      const alt = Math.max(0, (h[i] - sea) / (1 - sea));
      temp[i] = Math.max(0, Math.min(1, base - 0.65 * alt));
    }
  }
  return { moist, temp, flowN };
}
function hillshade(h, size, z) {
  const az = (315 * Math.PI) / 180, alt = (45 * Math.PI) / 180;
  const lx = Math.cos(alt) * Math.sin(az), ly = -Math.cos(alt) * Math.cos(az), lz = Math.sin(alt);
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const x0 = Math.max(0, x - 1), x1 = Math.min(size - 1, x + 1), y0 = Math.max(0, y - 1), y1 = Math.min(size - 1, y + 1);
    const dzdx = ((h[y * size + x1] - h[y * size + x0]) * z) / (x1 - x0), dzdy = ((h[y1 * size + x] - h[y0 * size + x]) * z) / (y1 - y0);
    out[y * size + x] = Math.max(0, (-dzdx * lx - dzdy * ly + lz) / Math.hypot(dzdx, dzdy, 1));
  }
  return out;
}

// ---- UI -------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const canvas = $("out"), ctx = canvas.getContext("2d");
let world = null, view = "biome";
const fmt = { drops: (v) => (v * 100).toFixed(0) + "% of cells", sea: (v) => (+v).toFixed(2), island: (v) => (+v).toFixed(2), warp: (v) => (+v).toFixed(2), ridge: (v) => (+v).toFixed(2), scale: (v) => (+v).toFixed(2) };
for (const k of Object.keys(fmt)) { const upd = () => ($(k + "-v").textContent = fmt[k]($(k).value)); $(k).addEventListener("input", upd); upd(); }

function generate() {
  document.body.classList.add("busy");
  $("go").disabled = true;
  setTimeout(() => {
    const t0 = performance.now();
    const size = +$("size").value, seed = Math.floor(+$("seed").value) || 0, sea = +$("sea").value;
    const o = { scale: +$("scale").value, warp: +$("warp").value, ridge: +$("ridge").value, island: +$("island").value };
    const h = heightfield(size, seed, o), raw = h.slice();
    const t1 = performance.now();
    const drops = Math.round(size * size * +$("drops").value), flow = new Float32Array(size * size);
    erode(h, size, drops, seed, flow);
    const t2 = performance.now();
    const c = climate(h, size, sea, seed, flow);
    let land = 0; for (const v of h) if (v >= sea) land++;
    world = { size, h, raw, sea, flow, ...c };
    $("stats").textContent = `${size}x${size}, seed ${seed}\nnoise     ${(t1 - t0).toFixed(0)} ms\nerosion   ${(t2 - t1).toFixed(0)} ms (${drops.toLocaleString()} droplets)\nland      ${((land / h.length) * 100).toFixed(0)}%`;
    draw();
    document.body.classList.remove("busy");
    $("go").disabled = false;
  }, 30);
}

function draw() {
  if (!world) return;
  const { size, sea } = world, h = view === "raw" ? world.raw : world.h;
  const shade = hillshade(h, size, size * 0.25);
  canvas.width = canvas.height = size;
  const img = ctx.createImageData(size, size), d = img.data;
  for (let i = 0; i < size * size; i++) {
    let rgb;
    if (view === "height") { const v = h[i] * 255; rgb = [v, v, v]; }
    else if (view === "flow") { const f = world.flowN[i]; rgb = h[i] < sea ? [20, 30, 50] : [30 + f * 40, 34 + f * 120, 40 + f * 215]; }
    else {
      const b = view === "raw" ? classify(h[i], world.moist[i], world.temp[i], sea, 0) : classify(h[i], world.moist[i], world.temp[i], sea, world.flowN[i]);
      rgb = BIOMES[b];
    }
    const s = h[i] < sea || view === "height" || view === "flow" ? 1 : 0.55 + 0.6 * shade[i];
    d[i * 4] = Math.min(255, rgb[0] * s); d[i * 4 + 1] = Math.min(255, rgb[1] * s); d[i * 4 + 2] = Math.min(255, rgb[2] * s); d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

$("go").onclick = generate;
$("rand").onclick = () => { $("seed").value = Math.floor(Math.random() * 100000); generate(); };
$("views").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#views button").forEach((x) => x.classList.toggle("on", x === b));
  draw();
};
$("save").onclick = () => { const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = `terrain-${$("seed").value}-${view}.png`; a.click(); };
generate();
</script>
</body>
</html>
